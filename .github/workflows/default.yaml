name: 'default'

on:
  push:
    branches:
      - 'main'
    tags:
      - '*'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:

permissions:
  checks: 'write' # code_check-style_golangci_lint
  security-events: 'write' # security-sast_codeql
  contents: 'write' # delivery-release

jobs:
  # One pipeline, its stages run one after another. The two checks ccswitch needs beyond the
  # shared ones run INSIDE it, through its inputs, rather than as jobs of their own here: a job
  # beside the call can only wait for the whole called workflow, so it used to start at once,
  # beside the first stage, and delivery never waited for it.
  default:
    uses: 'rios0rios0/pipelines/.github/workflows/go-binary.yaml@main'
    with:
      binary_name: 'ccswitch'
      # ccswitch ships binaries for six OS/arch pairs, and platform-specific code (process
      # detachment, liveness probing, session detection) only fails to compile on the platform
      # it is written for. Without this check a Windows-only compile error stays invisible until
      # GoReleaser hits it during delivery -- which is exactly how every release up to 0.2.2
      # ended up publishing no binaries at all. One job, `code-check > quality:cross-compile`,
      # type-checks all six targets.
      cross_compile: true
      # The shared pipeline runs the tests on Linux only, and the cross-compile check only
      # type-checks the other targets. Windows is where ccswitch behaves most differently -- the
      # ToolHelp32 session probe, process detachment and liveness, the self-update swap of a
      # running .exe -- and only a run there shows it. It runs as `tests > test:windows` in the
      # tests stage; the Linux `test:all` still owns coverage and the published reports.
      extra_test_name: 'windows'
      extra_test_command: 'go test -count=1 ./...'
      extra_test_runs_on: '["windows-latest"]'
