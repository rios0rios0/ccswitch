body: 'added the meters and colors of `ccswitch list` to `ccswitch show` on a terminal: the usage lines get the same bars, colors and columns, an exhausted account is red, the `(active)` mark green, countdowns cyan, and the credentials warning and unreadable usage yellow; output that is piped or redirected stays the plain text it was'
