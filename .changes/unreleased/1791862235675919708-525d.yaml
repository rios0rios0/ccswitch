kind: 'Added'
body: 'added support for the OpenAI Codex CLI beside Claude Code: `ccswitch enroll --provider codex` captures the ChatGPT account Codex is signed in to, and from then on its accounts are listed, shown, monitored, refreshed and rotated like Claude''s, each provider among its own accounts with an order, an active account and exhaustion of its own. Codex''s limits come from the endpoint behind its own `/status`: the windows of its plan, named by their length (the single `30-day` window of a free plan, the `5-hour` and `7-day` windows of a paid one), which decide rotation, and its code-review and per-model limits, which are listed but never rotate an account away. A command that names an email finds the provider it is enrolled with on its own, `--provider`/`-p` names one where needed (`enroll`, `rotate`, `ensure` and `capacity` keep acting on Claude''s accounts without it), and `--codex-home` points at a Codex home other than `~/.codex`. Codex''s accounts are kept in `store.codex.json` beside the store, so a monitor daemon still running an older ccswitch cannot erase them, and Codex''s `auth.json` is rewritten keeping every other key, never without the ID token Codex needs to load it, and never over a sign-in made with an API key'
time: '2026-10-13T03:30:35.674347178Z'
