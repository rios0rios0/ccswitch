kind: 'Changed'
body: 'changed `ccswitch use` and `ccswitch rotate` to pin the account they switch to: the monitor now keeps it active for as long as it has capacity, even when an account of higher priority has more. With `--prefer-primary`, the default, the monitor used to move every pick back to the primary on its next poll -- recorded for the next launch while a session was running, so the shell wrapper''s `ensure` installed the primary on the next `claude` -- and a pick lasted five minutes at most. Once a poll finds the pinned account exhausted, the pin is released and rotation goes on as before; an account enrolled from a long-lived token, whose usage cannot be polled, stays until another account is picked. `ccswitch threshold` keeps a pinned account that is still under the new threshold'
time: '2026-11-05T21:17:45.994883582Z'
