kind: 'Fixed'
body: 'stopped rebuilding credentials from the token-refresh response alone. The endpoint answers a refresh with the new token pair and little else, so the previous code wrote back a credential document with no `scopes`, no `subscriptionType` and no refresh-token expiry -- and Claude Code refuses to persist its own later refresh of a set whose scopes do not name `user:inference`, classifying it as not-claude.ai. The pair on disk then went stale, the refresh after that answered `invalid_grant`, and Claude Code blanked the credentials: the logout. A refresh now names the scopes it wants, reads `scope` and `refresh_token_expires_in` back, and merges onto the credentials it replaces. An account an earlier version already stripped is repaired on its next poll'
time: '2026-09-01T17:36:52.47557737Z'
