kind: 'Added'
body: 'added `ccswitch threshold [percent]`, which shows the rotation threshold or sets it. The value is persisted in the store, so a running monitor daemon picks it up on its next tick without being restarted, and it is applied at once: every account is repolled, the exhaustion markers the old threshold produced are rewritten, and the highest-priority account below the new threshold becomes active. `--reset` goes back to the built-in default'
time: '2026-09-01T17:37:01.404249478Z'
